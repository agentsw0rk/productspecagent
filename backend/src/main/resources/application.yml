server:
  port: 8080

spring:
  application:
    name: product-spec-agent
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://productspecagent-frontend.netrtl.com}

auth:
  admin-emails: "${AUTH_ADMIN_EMAILS:},arekczarnik@googlemail.com"
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret}
    expiry-seconds: 604800

hackathon:
  lock:
    enabled: ${HACKATHON_LOCK_ENABLED:true}
    title: ${HACKATHON_LOCK_TITLE:Hackathon CVDT}
    event-date: ${HACKATHON_LOCK_EVENT_DATE:2026-06-26}
    target-at: ${HACKATHON_LOCK_TARGET_AT:2026-06-26T09:00:00+02:00}
    admin-bypass-enabled: ${HACKATHON_LOCK_ADMIN_BYPASS_ENABLED:true}

ai:
  koog:
    openai:
      enabled: ${KOOG_OPENAI_ENABLED:true}
      api-key: ${OPENAI_API_KEY:not-set}
    anthropic:
      enabled: ${KOOG_ANTHROPIC_ENABLED:false}
      api-key: ${ANTHROPIC_AUTH_TOKEN:not-set}
      base-url: ${ANTHROPIC_BASE_URL:https://llm.ai.netrtl.com}

agent:
  models:
    resolver: ${AGENT_MODEL_RESOLVER:openai}
    # Claude example:
    # resolver: claude
    tiers:
      SMALL: ${AGENT_MODEL_SMALL:gpt-5.4-nano}
      MEDIUM: ${AGENT_MODEL_MEDIUM:gpt-5.4-mini}
      LARGE: ${AGENT_MODEL_LARGE:gpt-5-2}
      # Claude example:
      # SMALL: "claude-haiku-4-5"
      # MEDIUM: "claude-sonnet-4-6"
      # LARGE: "claude-sonnet-4-6"
    defaults:
      idea-to-spec: LARGE
      decision: MEDIUM
      wizard-blocker-apply: MEDIUM
      acceptance-criteria-proposal: MEDIUM
      feature-proposal: MEDIUM
      plan-generator: LARGE
      design-summary: MEDIUM
      design-variant: MEDIUM
      design-image-analysis: MEDIUM
app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:https://productspecagent-frontend.netrtl.com}
  storage:
    bucket: ${S3_BUCKET:productspec-data}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: ${S3_PATH_STYLE:false}

graphmesh:
  enabled: ${GRAPHMESH_ENABLED:false}
  url: ${GRAPHMESH_URL:http://localhost:8083/graphql}
  request-timeout: 30s

feature-proposal:
  uploads:
    max-bytes-per-file: ${FEATURE_PROPOSAL_UPLOAD_MAX_BYTES_PER_FILE:102400}
    max-bytes-total: ${FEATURE_PROPOSAL_UPLOAD_MAX_BYTES_TOTAL:512000}

design:
  bundle:
    max-zip-bytes: ${DESIGN_BUNDLE_MAX_ZIP_BYTES:5242880}
    max-extracted-bytes: ${DESIGN_BUNDLE_MAX_EXTRACTED_BYTES:10485760}
    max-files: ${DESIGN_BUNDLE_MAX_FILES:500}
    max-file-bytes: ${DESIGN_BUNDLE_MAX_FILE_BYTES:5242880}
    summary-max-file-bytes: ${DESIGN_BUNDLE_SUMMARY_MAX_FILE_BYTES:51200}
    summary-max-total-bytes: ${DESIGN_BUNDLE_SUMMARY_MAX_TOTAL_BYTES:204800}
    summary-max-jsx-files: ${DESIGN_BUNDLE_SUMMARY_MAX_JSX_FILES:5}
