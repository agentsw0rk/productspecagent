default:
  image: hub.netrtl.com/public/redo:1
  tags:
    - k8s-managed-devops
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  ARGOCD_PROJECT: cvdt/argocd-internal

stages:
  - build
  - deploy-vars
  - deploy-prod

include:
  - project: templates/ci/redo
    file: /jobs/version-update.gitlab-ci.yml
  - project: templates/ci/redo
    file: /jobs/version-commit.gitlab-ci.yml
  - component: gitlab.netrtl.com/templates/ci/component/argocd/deploy@0
    inputs:
      step: deploy-prod
      stage: deploy-prod
      argocd_app_dir: apps/productspecagent/prod
      argocd_app_values: values.yaml
      when: always

docker-build:
  stage: build
  script:
    - |
      if [ "$PROJECT_DIR" = "frontend" ]; then
        if [ -n "${NEXT_PUBLIC_API_URL:-}" ]; then
          echo "Passing NEXT_PUBLIC_API_URL as Docker build arg for frontend (set)"
        else
          echo "Passing NEXT_PUBLIC_API_URL as Docker build arg for frontend (unset)"
        fi
        redo docker:build docker:push \
          -Dproject_name=$PROJECT_DIR \
          -Ddocker_build_ctx=$PROJECT_DIR \
          -Ddocker_build_file=$PROJECT_DIR/Dockerfile \
          -Ddocker_build_args="--build-arg NEXT_PUBLIC_API_URL"
      else
        redo docker:build docker:push \
          -Dproject_name=$PROJECT_DIR \
          -Ddocker_build_ctx=$PROJECT_DIR \
          -Ddocker_build_file=$PROJECT_DIR/Dockerfile
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
  parallel:
    matrix:
      - PROJECT_DIR: backend
      - PROJECT_DIR: frontend

deploy-vars:
  stage: deploy-vars
  script:
    - redo write -Dfrom=deploy-vars.tpl.env -Dto=deploy-vars.env
  artifacts:
    reports:
      dotenv: deploy-vars.env
  only:
    - tags
